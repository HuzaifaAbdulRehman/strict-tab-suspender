name: Bug report
description: Report a reproducible Strict Tab Discarder issue.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Do not include URLs, page titles, or other browsing data.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
