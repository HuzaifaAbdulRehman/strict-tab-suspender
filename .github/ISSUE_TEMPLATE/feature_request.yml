name: Feature request
description: Suggest a privacy-preserving improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed outcome
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permissions impact
      description: Explain whether this needs data collection or permissions beyond alarms and storage.
    validations:
      required: true
